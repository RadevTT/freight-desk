<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Carriers</title>
</head>

<body>

<h1>Carriers</h1>

<a th:href="@{/carriers/new}">
  + Add Carrier
</a>

<a th:href="@{/carriers/inactive}">
  Inactive Carriers
</a>

<table border="1">

  <thead>
  <tr>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Company</th>
    <th>Country</th>
    <th>City</th>
    <th>Actions</th>
  </tr>
  </thead>

  <tbody>

  <tr th:each="carrier : ${carriers}">

    <td th:text="${carrier.name}"></td>
    <td th:text="${carrier.email}"></td>
    <td th:text="${carrier.phone}"></td>
    <td th:text="${carrier.companyName}"></td>
    <td th:text="${carrier.companyCountry}"></td>
    <td th:text="${carrier.companyCity}"></td>

    <td>

      <a th:href="@{/carriers/edit/{id}(id=${carrier.id})}">
        Edit
      </a>

      <form th:action="@{/carriers/deactivate/{id}(id=${carrier.id})}"
            method="post"
            style="display: inline;">

        <button type="submit">Deactivate</button>

      </form>

    </td>

  </tr>

  </tbody>

</table>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Freight Request</title>
</head>

<body>

<h1>Freight Request</h1>

<form th:action="@{/freight-requests}"
      th:object="${freightRequest}"
      method="post">

  <input type="hidden" th:field="*{id}">

  <!-- CUSTOMER -->

  <label>Customer:</label>

  <select th:field="*{customerId}">

    <option value="">Select customer</option>

    <option th:each="customer : ${customers}"
            th:value="${customer.id}"
            th:text="${customer.name}">
    </option>

  </select>

  <br><br>


  <!-- CARRIER -->

  <h3>Carrier</h3>

  <!--
      SELECTED OFFER EXISTS
      Carrier is controlled by the selected offer.
  -->

  <div th:if="${isEdit and selectedOffer != null}">

    <p>
      <strong>Selected carrier company:</strong>
      <span th:text="${selectedOffer.companyName}"></span>
    </p>

    <p>
      <strong>Selected carrier contact:</strong>
      <span th:text="${selectedOffer.carrierName != null
                      ? selectedOffer.carrierName
                      : 'No contact selected'}"></span>
    </p>

    <p>
      <strong>Carrier price:</strong>
      <span th:text="${selectedOffer.offeredPrice}"></span>
      <span th:text="${selectedOffer.currency}"></span>
    </p>

    <a th:href="@{/freight-requests/{id}/offers(id=${freightRequest.id})}">
      View / Change carrier offer
    </a>

  </div>


  <!--
      NO SELECTED OFFER
      Carrier can be entered manually.
  -->

  <div th:unless="${isEdit and selectedOffer != null}">

    <label>Carrier company:</label>

    <select id="carrierCompany">

      <option value="">Select company</option>

      <option th:each="company : ${carrierCompanies}"
              th:value="${company.id}"
              th:text="${company.name}"
              th:selected="${company.id == selectedCarrierCompanyId}">
      </option>

    </select>

    <br><br>

    <!-- CARRIER CONTACT -->

    <div id="carrierContactContainer"
         th:style="${selectedCarrierCompanyId != null}
                  ? 'display: block;'
                  : 'display: none;'">

      <label>Contact:</label>

      <select id="carrierContact"
              th:field="*{carrierId}">

        <option value="">Select contact</option>

        <option th:each="carrier : ${carrierContacts}"
                th:value="${carrier.id}"
                th:text="${carrier.name}">
        </option>

      </select>

    </div>

  </div>

  <br><br>


  <!-- REQUEST DATE -->

  <label>Request date:</label>

  <input type="date"
         name="requestDate"
         th:value="${freightRequest.requestDate != null
                    ? #temporals.format(
                        freightRequest.requestDate,
                        'yyyy-MM-dd'
                      )
                    : ''}">

  <br><br>


  <!-- LOADING DATE -->

  <label>Loading date:</label>

  <input type="date"
         name="loadingDate"
         th:value="${freightRequest.loadingDate != null
                    ? #temporals.format(
                        freightRequest.loadingDate,
                        'yyyy-MM-dd'
                      )
                    : ''}">

  <br><br>


  <!-- DELIVERY TIME -->

  <label>Delivery time:</label>

  <input type="text"
         id="deliveryTime"
         th:field="*{deliveryTime}"
         placeholder="e.g. 2-3 days">

  <input type="date"
         id="deliveryDatePicker"
         style="margin-left: 5px;">

  <br><br>

  <script>

    document.getElementById("deliveryDatePicker")
        .addEventListener("change", function () {

            if (this.value) {

                document.getElementById("deliveryTime").value =
                    this.value;
            }
        });

  </script>


  <!-- LOADING -->

  <h3>Loading</h3>

  <label>Country:</label>

  <select th:field="*{loadingCountry}">

    <option value="">Select country</option>

    <option th:each="country : ${countries}"
            th:value="${country.code}"
            th:text="${country.name}">
    </option>

  </select>

  <label>City:</label>

  <input type="text"
         th:field="*{loadingCity}">

  <label>Postal code:</label>

  <input type="text"
         th:field="*{loadingPostalCode}">

  <br><br>


  <!-- UNLOADING -->

  <h3>Unloading</h3>

  <label>Country:</label>

  <select th:field="*{unloadingCountry}">

    <option value="">Select country</option>

    <option th:each="country : ${countries}"
            th:value="${country.code}"
            th:text="${country.name}">
    </option>

  </select>

  <label>City:</label>

  <input type="text"
         th:field="*{unloadingCity}">

  <label>Postal code:</label>

  <input type="text"
         th:field="*{unloadingPostalCode}">

  <br><br>


  <!-- CARGO -->

  <h3>Cargo</h3>

  <label>Weight:</label>

  <input type="number"
         step="0.01"
         th:field="*{weight}">

  <label>Loading meters:</label>

  <input type="number"
         step="0.01"
         th:field="*{loadingMeters}">

  <label>Volume:</label>

  <input type="number"
         step="0.01"
         th:field="*{volume}">

  <br><br>

  <label>Dimensions (m):</label>

  <input type="text"
         th:field="*{dimensions}"
         placeholder="e.g. 2.4 x 2.5 x 4.2">

  <label>Pallets / pieces:</label>

  <input type="number"
         th:field="*{pallets}">

  <br><br>


  <!-- CARGO TYPE -->

  <label>Cargo type:</label>

  <select th:field="*{cargoType}">

    <option value="">Select cargo type</option>

    <option value="grup">Групажен</option>

    <option value="kompl">Комплектен</option>

    <option value="korg">Групажен/Комплектен</option>

    <option value="nasip">Насипен</option>

    <option value="drug">Друг</option>

  </select>

  <br><br>


  <!-- SPEDITOR -->

  <h3>Speditor</h3>

  <label>Speditor price:</label>

  <input type="text"
         th:field="*{speditorPrice}">

  <br><br>

  <label>Additional information:</label>

  <input type="text"
         th:field="*{additionalInfo}"
         size="60">

  <br><br>


  <!-- VEHICLE / TRANSPORT REQUIREMENTS -->

  <h3>Vehicle / transport requirements</h3>

  <label>
    <input type="checkbox"
           th:field="*{trailer}">
    Прицеп
  </label>

  <label>
    <input type="checkbox"
           th:field="*{hanger}">
    Хенгер
  </label>

  <label>
    <input type="checkbox"
           th:field="*{refrigerated}">
    Хладилен
  </label>

  <label>
    <input type="checkbox"
           th:field="*{dualTemperature}">
    Двутемпературен
  </label>

  <label>
    <input type="checkbox"
           th:field="*{van}">
    Фургон
  </label>

  <label>
    <input type="checkbox"
           th:field="*{microbus}">
    Микробус
  </label>

  <label>
    <input type="checkbox"
           th:field="*{clothingTruck}">
    Дрехарка
  </label>

  <label>
    <input type="checkbox"
           th:field="*{solo}">
    Соло
  </label>

  <label>
    <input type="checkbox"
           th:field="*{jumbo}">
    Джъмбо
  </label>

  <label>
    <input type="checkbox"
           th:field="*{tractor}">
    Влекач
  </label>

  <label>
    <input type="checkbox"
           th:field="*{platform}">
    Платформа
  </label>

  <label>
    <input type="checkbox"
           th:field="*{flatbed}">
    Бордови
  </label>

  <label>
    <input type="checkbox"
           th:field="*{containerTruck}">
    Контейнеровоз
  </label>

  <label>
    <input type="checkbox"
           th:field="*{container}">
    Контейнер
  </label>

  <label>
    <input type="checkbox"
           th:field="*{tanker}">
    Цистерна
  </label>

  <label>
    <input type="checkbox"
           th:field="*{megatrailer}">
    Мегатрейлър
  </label>

  <label>
    <input type="checkbox"
           th:field="*{carCarrier}">
    Автовоз
  </label>

  <label>
    <input type="checkbox"
           th:field="*{gondola}">
    Гондола
  </label>

  <label>
    <input type="checkbox"
           th:field="*{oversized}">
    Извънгабаритен
  </label>

  <label>
    <input type="checkbox"
           th:field="*{trailerOnly}">
    Ремарке
  </label>

  <label>
    <input type="checkbox"
           th:field="*{tunnel}">
    С тунел
  </label>

  <label>
    <input type="checkbox"
           th:field="*{tailLift}">
    Падащ борд
  </label>

  <label>
    <input type="checkbox"
           th:field="*{crane}">
    Кран
  </label>

  <label>
    <input type="checkbox"
           th:field="*{twoDrivers}">
    Двойка шофьори
  </label>

  <label>
    <input type="checkbox"
           th:field="*{palletTruck}">
    Палетна количка
  </label>

  <br><br>


  <!-- PRICES -->

  <h3>Prices</h3>

  <!-- CLIENT PRICE -->

  <label>Client price:</label>

  <input type="number"
         step="0.01"
         th:field="*{clientPrice}">

  <br><br>


  <!-- CARRIER PRICE -->

  <!--
      SELECTED OFFER EXISTS
  -->

  <div th:if="${isEdit and selectedOffer != null}">

    <div th:if="${isEdit and selectedOffer != null}">

      <label>Carrier price:</label>

      <strong>
        <span th:text="${selectedOffer.offeredPrice}"></span>
        <span th:text="${selectedOffer.currency}"></span>
      </strong>

      <br>

      <small>
        Price comes from the selected carrier offer.
      </small>

      <br>

      <a th:href="@{/freight-requests/{id}/offers(id=${freightRequest.id})}">
        Edit carrier offer
      </a>

    </div>


  <!--
      NO SELECTED OFFER
  -->

  <div th:unless="${isEdit and selectedOffer != null}">

    <label>Carrier price:</label>

    <input type="number"
           step="0.01"
           th:field="*{carrierPrice}">

  </div>

  <br><br>


  <!-- STATUS -->

  <label>Status:</label>

  <select th:field="*{status}">

    <option value="">Select status</option>

    <option th:each="status : ${T(bg.freightdesk.model.RequestStatus).values()}"
            th:value="${status}"
            th:text="${status}">
    </option>

  </select>

  <br><br>


  <!-- SAVE -->

  <button type="submit">
    Save
  </button>

</form>


<!-- CARRIER COMPANY → CONTACT -->

<script>

  const companySelect =
      document.getElementById("carrierCompany");

  const contactContainer =
      document.getElementById("carrierContactContainer");

  const contactSelect =
      document.getElementById("carrierContact");


  if (companySelect) {

      companySelect.addEventListener("change", function () {

          const companyId = this.value;

          contactSelect.innerHTML =
              '<option value="">Select contact</option>';


          if (!companyId) {

              contactContainer.style.display = "none";

              return;
          }


          fetch(
              "/freight-requests/carriers?companyId="
              + companyId
          )
          .then(response => response.json())
          .then(carriers => {

              carriers.forEach(carrier => {

                  const option =
                      document.createElement("option");

                  option.value =
                      carrier.id;

                  option.textContent =
                      carrier.name;

                  contactSelect.appendChild(
                      option
                  );
              });


              contactContainer.style.display = "block";
          });

      });

  }

</script>


</body>
</html>

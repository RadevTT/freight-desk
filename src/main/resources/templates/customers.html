<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Customers</title>
</head>

<body>

<h1>Customers</h1>

<a th:href="@{/customers/new}">
    + Add Customer
</a>

<a th:href="@{/customers/inactive}">
    Inactive Customers
</a>

<br><br>

<table border="1">

    <thead>
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Company</th>
        <th>Country</th>
        <th>City</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="customer : ${customers}">

        <td th:text="${customer.name}"></td>

        <td th:text="${customer.email}"></td>

        <td th:text="${customer.phone}"></td>

        <td th:text="${customer.companyName}"></td>

        <td th:text="${customer.companyCountry}"></td>

        <td th:text="${customer.companyCity}"></td>

        <td>
            <a th:href="@{/customers/edit/{id}(id=${customer.id})}">
                Edit
            </a>

            <form th:action="@{/customers/deactivate/{id}(id=${customer.id})}"
                  method="post"
                  style="display: inline;">

                <button type="submit">Deactivate</button>

            </form>
        </td>

    </tr>

    </tbody>

</table>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Company</title>

  <style>

    .deactivate-section {
        margin-top: 50px;
        padding-top: 20px;
        border-top: 1px solid #ccc;
    }

    .modal {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
    }

    .modal-content {
        background: white;
        width: 400px;
        margin: 100px auto;
        padding: 20px;
    }

  </style>

</head>

<body>

<h1 th:text="${company.id == null ? 'New Company' : 'Edit Company'}">
  Company
</h1>


<form th:action="${company.id == null}
                ? @{/companies}
                : @{/companies/edit/{id}(id=${company.id})}"
      th:object="${company}"
      method="post">

  <input type="hidden"
         th:field="*{id}">

  <input type="hidden"
         th:name="${_csrf.parameterName}"
         th:value="${_csrf.token}">

  <input type="hidden" th:field="*{id}">


  <label>Name:</label>

  <input type="text"
         th:field="*{name}">

  <br><br>


  <label>Company code:</label>

  <input type="text"
         th:field="*{companyCode}">

  <br><br>


  <label>Country:</label>

  <input type="text"
         th:field="*{country}">

  <br><br>


  <label>City:</label>

  <input type="text"
         th:field="*{city}">

  <br><br>


  <label>Type:</label>

  <select th:field="*{type}">

    <option value="">
      -- Select type --
    </option>

    <option th:each="type : ${companyTypes}"
            th:value="${type}"
            th:text="${type}">
    </option>

  </select>


  <!-- FIRST CONTACT -->
  <div th:if="${company.id == null}">

    <h2>First contact</h2>

    <label>Name:</label>

    <input type="text"
           th:field="*{contactName}">

    <br><br>


    <label>Email:</label>

    <input type="email"
           th:field="*{contactEmail}">

    <br><br>


    <label>Phone:</label>

    <input type="text"
           th:field="*{contactPhone}">

    <br><br>

  </div>


  <button type="submit">
    Save
  </button>

</form>


<!-- CONTACTS -->

<div th:if="${company.id != null}">

  <h2>Contacts</h2>


  <!-- CUSTOMERS -->

  <div th:if="${company.type.name() == 'CUSTOMER'}">

    <table border="1">

      <thead>

      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
      </tr>

      </thead>

      <tbody>

      <tr th:each="customer : ${customers}">

        <td th:text="${customer.name}">
        </td>

        <td th:text="${customer.email}">
        </td>

        <td th:text="${customer.phone}">
        </td>

        <td>

          <a th:href="@{/customers/edit/{id}(id=${customer.id})}">
            Edit
          </a>

        </td>

      </tr>

      </tbody>

    </table>

  </div>


  <!-- CARRIERS -->

  <div th:if="${company.type.name() == 'CARRIER'}">

    <table border="1">

      <thead>

      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
      </tr>

      </thead>

      <tbody>

      <tr th:each="carrier : ${carriers}">

        <td th:text="${carrier.name}">
        </td>

        <td th:text="${carrier.email}">
        </td>

        <td th:text="${carrier.phone}">
        </td>

        <td>

          <a th:href="@{/carriers/edit/{id}(id=${carrier.id})}">
            Edit
          </a>

        </td>

      </tr>

      </tbody>

    </table>

  </div>


  <br>

  <a th:href="@{/customers/new}"
     th:if="${company.type.name() == 'CUSTOMER'}">
    Add Contact
  </a>


  <a th:href="@{/carriers/new}"
     th:if="${company.type.name() == 'CARRIER'}">
    Add Contact
  </a>


  <!-- DEACTIVATE -->

  <div class="deactivate-section">

    <button type="button"
            onclick="openDeactivateModal()">

      Deactivate

    </button>

  </div>

</div>


<!-- DEACTIVATE MODAL -->

<div id="deactivateModal"
     class="modal">

  <div class="modal-content">

    <h2>Deactivate</h2>

    <p>
      What do you want to deactivate?
    </p>


    <form method="post"
          id="deactivateForm">

      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}">


      <label>

        <input type="radio"
               name="deactivateType"
               value="company"
               onclick="selectCompany()">

        Entire company

      </label>


      <br><br>


      <label>

        <input type="radio"
               name="deactivateType"
               value="contact"
               onclick="selectContact()">

        Contact

      </label>


      <br><br>


      <select id="contactSelect"
              style="display:none;">

        <option value="">
          Select contact
        </option>


        <option th:each="customer : ${customers}"
                th:value="${customer.id}"
                th:text="${customer.name}">
        </option>


        <option th:each="carrier : ${carriers}"
                th:value="${carrier.id}"
                th:text="${carrier.name}">
        </option>

      </select>


      <br><br>


      <button type="button"
              onclick="closeDeactivateModal()">

        Cancel

      </button>


      <button type="submit">

        Deactivate

      </button>

    </form>

  </div>

</div>


<script>

  const modal =
      document.getElementById("deactivateModal");

  const form =
      document.getElementById("deactivateForm");

  const contactSelect =
      document.getElementById("contactSelect");


  function openDeactivateModal() {

      modal.style.display = "block";

  }


  function closeDeactivateModal() {

      modal.style.display = "none";

  }


  function selectCompany() {

      contactSelect.style.display = "none";

      form.action =
          "/companies/deactivate/" +
          "[[${company.id}]]";

  }


  function selectContact() {

      contactSelect.style.display = "block";

      contactSelect.onchange = function () {

          if (!this.value) {
              return;
          }

          if ("[[${company.type}]]" === "CUSTOMER") {

              form.action =
                  "/customers/deactivate/" +
                  this.value;

          } else {

              form.action =
                  "/carriers/deactivate/" +
                  this.value;

          }

      };

  }

</script>

</body>

</html>

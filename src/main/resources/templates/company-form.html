<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Company</title>

  <style>

    .deactivate-section {
        margin-top: 25px;
        margin-bottom: 40px;
        padding-top: 20px;
        border-top: 1px solid #ccc;
    }

    .inactive-section {
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #ccc;
    }

  </style>

</head>

<body>

<h1 th:text="${company.id == null ? 'New Company' : 'Edit Company'}">
  Company
</h1>


<!-- COMPANY FORM -->

<form th:action="${company.id == null}
                ? @{/companies}
                : @{/companies/edit/{id}(id=${company.id})}"
      th:object="${company}"
      method="post">

  <input type="hidden"
         th:field="*{id}">

  <input type="hidden"
         th:name="${_csrf.parameterName}"
         th:value="${_csrf.token}">


  <label>Name:</label>

  <input type="text"
         th:field="*{name}">

  <span th:if="${#fields.hasErrors('name')}"
        th:errors="*{name}">
  </span>

  <br><br>


  <label>Company code:</label>

  <input type="text"
         th:field="*{companyCode}">

  <br><br>


  <label>Country:</label>

  <input type="text"
         th:field="*{country}">

  <br><br>


  <label>City:</label>

  <input type="text"
         th:field="*{city}">

  <br><br>


  <label>Type:</label>

  <select th:field="*{type}">

    <option value="">
      -- Select type --
    </option>

    <option th:each="type : ${companyTypes}"
            th:value="${type}"
            th:text="${type}">
    </option>

  </select>

  <span th:if="${#fields.hasErrors('type')}"
        th:errors="*{type}">
  </span>

  <br><br>


  <!-- FIRST CONTACT -->

  <div th:if="${company.id == null}">

    <h2>First contact</h2>

    <label>Name:</label>

    <input type="text"
           th:field="*{contactName}">

    <span th:if="${#fields.hasErrors('contactName')}"
          th:errors="*{contactName}">
    </span>

    <br><br>


    <label>Email:</label>

    <input type="email"
           th:field="*{contactEmail}">

    <br><br>


    <label>Phone:</label>

    <input type="text"
           th:field="*{contactPhone}">

    <br><br>

  </div>


  <button type="submit">
    Save
  </button>

</form>


<!-- EDIT COMPANY ONLY -->

<div th:if="${company.id != null}">

  <!-- DEACTIVATE COMPANY -->

  <div class="deactivate-section">

    <h2>Company</h2>

    <form th:action="@{/companies/deactivate/{id}(id=${company.id})}"
          method="post">

      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}">

      <button type="submit">
        Deactivate Company
      </button>

    </form>

  </div>


  <!-- ACTIVE CONTACTS -->

  <h2>Active Contacts</h2>


  <!-- ACTIVE CUSTOMERS -->

  <div th:if="${company.type != null and company.type.name() == 'CUSTOMER'}">

    <table border="1">

      <thead>

      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
      </tr>

      </thead>

      <tbody>

      <tr th:each="customer : ${customers}">

        <td th:text="${customer.name}">
        </td>

        <td th:text="${customer.email}">
        </td>

        <td th:text="${customer.phone}">
        </td>

        <td>

          <a th:href="@{/customers/edit/{id}(id=${customer.id})}">
            Edit
          </a>

          &nbsp;

          <form th:action="@{/customers/deactivate/{id}(id=${customer.id})}"
                method="post"
                style="display:inline;">

            <input type="hidden"
                   name="companyId"
                   th:value="${company.id}">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit">
              Deactivate
            </button>

          </form>

        </td>

      </tr>

      </tbody>

    </table>

  </div>


  <!-- ACTIVE CARRIERS -->

  <div th:if="${company.type != null and company.type.name() == 'CARRIER'}">

    <table border="1">

      <thead>

      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
      </tr>

      </thead>

      <tbody>

      <tr th:each="carrier : ${carriers}">

        <td th:text="${carrier.name}">
        </td>

        <td th:text="${carrier.email}">
        </td>

        <td th:text="${carrier.phone}">
        </td>

        <td>

          <a th:href="@{/carriers/edit/{id}(id=${carrier.id})}">
            Edit
          </a>

          &nbsp;

          <form th:action="@{/carriers/deactivate/{id}(id=${carrier.id})}"
                method="post"
                style="display:inline;">

            <input type="hidden"
                   name="companyId"
                   th:value="${company.id}">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit">
              Deactivate
            </button>

          </form>

        </td>

      </tr>

      </tbody>

    </table>

  </div>


  <br>


  <!-- ADD CONTACT -->

  <a th:href="@{/customers/new(companyId=${company.id})}"
     th:if="${company.type != null and company.type.name() == 'CUSTOMER'}">
    Add Contact
  </a>


  <a th:href="@{/carriers/new(companyId=${company.id})}"
     th:if="${company.type != null and company.type.name() == 'CARRIER'}">
    Add Contact
  </a>


  <!-- INACTIVE CONTACTS -->

  <div class="inactive-section">

    <h2>Inactive Contacts</h2>


    <!-- INACTIVE CUSTOMERS -->

    <div th:if="${company.type != null and company.type.name() == 'CUSTOMER'}">

      <table border="1">

        <thead>

        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="customer : ${inactiveCustomers}">

          <td th:text="${customer.name}">
          </td>

          <td th:text="${customer.email}">
          </td>

          <td th:text="${customer.phone}">
          </td>

          <td>

            <form th:action="@{/customers/activate/{id}(id=${customer.id})}"
                  method="post">

              <input type="hidden"
                     name="companyId"
                     th:value="${company.id}">

              <input type="hidden"
                     th:name="${_csrf.parameterName}"
                     th:value="${_csrf.token}">

              <button type="submit">
                Activate
              </button>

            </form>

          </td>

        </tr>

        </tbody>

      </table>

    </div>


    <!-- INACTIVE CARRIERS -->

    <div th:if="${company.type != null and company.type.name() == 'CARRIER'}">

      <table border="1">

        <thead>

        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="carrier : ${inactiveCarriers}">

          <td th:text="${carrier.name}">
          </td>

          <td th:text="${carrier.email}">
          </td>

          <td th:text="${carrier.phone}">
          </td>

          <td>

            <form th:action="@{/carriers/activate/{id}(id=${carrier.id})}"
                  method="post">

              <input type="hidden"
                     name="companyId"
                     th:value="${company.id}">

              <input type="hidden"
                     th:name="${_csrf.parameterName}"
                     th:value="${_csrf.token}">

              <button type="submit">
                Activate
              </button>

            </form>

          </td>

        </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Customer</title>
</head>

<body>

<h1>Customer</h1>

<form th:action="@{/customers}"
      th:object="${customer}"
      method="post">

    <input type="hidden"
           th:field="*{id}">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">


    <label>Name:</label>

    <input type="text"
           th:field="*{name}">

    <span th:if="${#fields.hasErrors('name')}"
          th:errors="*{name}">
    </span>

    <br><br>


    <label>Email:</label>

    <input type="email"
           th:field="*{email}">

    <br><br>


    <label>Phone:</label>

    <input type="text"
           th:field="*{phone}">

    <br><br>


    <label>Company:</label>

    <select th:field="*{companyId}">

        <option value="">
            Select company
        </option>

        <option th:each="company : ${companies}"
                th:value="${company.id}"
                th:text="${company.name}">
        </option>

    </select>

    <span th:if="${#fields.hasErrors('companyId')}"
          th:errors="*{companyId}">
    </span>

    <br><br>


    <button type="submit">
        Save
    </button>

</form>

</body>
</html>
